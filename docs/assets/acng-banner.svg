<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">ACNG — Racing feel. Open roads. Real consequences.</title>
  <desc id="description">Original ACNG artwork: cyan roads and an orange node-beam chassis on a dark dashboard.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09101c"/><stop offset="1" stop-color="#182637"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#70efc2"/><stop offset="1" stop-color="#62bfff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a2c7e5" stroke-opacity=".065"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <path d="M710 0L590 460H1200V0Z" fill="#020710" opacity=".24"/>
