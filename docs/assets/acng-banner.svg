    <text x="54" y="243" fill="#78edc5" font-size="24" font-weight="600">Racing feel. Open roads.</text>
    <text x="54" y="279" fill="#e1eafa" font-size="24" font-weight="600">Real consequences.</text>
    <text x="54" y="327" fill="#a9bbd0" font-size="15">Richer tires and feedback. Native suspension and damage.</text>
